[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvisualiser"
version = "2.0.0"
description = "GPU-accelerated audio visualisation engine for desktop and embedded Hi-Fi systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Baloo the bear" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

# Core dependencies required on all operating systems
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pygame>=2.5.0",
    "moderngl>=5.8.0",
    "pyaudio>=0.2.13",
    "aubio>=0.4.9",
    "requests>=2.28.0",
    "roonapi>=0.1.6",
    "events>=0.5",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",

    # macOS specific dependencies (Strictly ignored by pip on Linux / Raspberry Pi)
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "packaging>=23.0",
]
pi = [
    # Lightweight headless Linux extensions if needed
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyvisualiser = [
    "backgrounds/*",
    "fonts/**/*",
    "VU Images/*",
    "assets/**/*",
]